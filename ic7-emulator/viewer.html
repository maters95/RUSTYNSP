<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iC-7 Simulator</title>
<style>
:root{--ink:#202d26;--line:#cbd6cf;--green:#167849;--muted:#627067;--paper:#f3f6f4}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'Trebuchet MS',sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:700}header span{color:var(--muted);font-size:13px}.status{display:flex;gap:10px;align-items:center}.dot{width:8px;height:8px;background:var(--green);border-radius:50%}
main{max-width:1320px;margin:auto;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:24px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);max-width:100%}button{cursor:pointer}button:hover{border-color:var(--green)}label{display:flex;gap:7px;align-items:center;font-size:13px}
.display{width:100%;aspect-ratio:5/3;background:#101314;display:grid;place-items:center;overflow:hidden;border:1px solid #38453d}.display img,.display video{display:block;max-width:100%;max-height:100%;object-fit:contain;width:100%;height:100%}.display .empty{color:#b6c6bb;font-size:15px;padding:24px}
.caption{margin-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.assets{border-left:1px solid var(--line);padding-left:20px;min-width:0}h2{font-size:15px;margin:0 0 14px}.asset-list{max-height:590px;overflow:auto}.asset{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);padding:10px 0;background:none;border-radius:0;text-align:left}.asset img{width:64px;height:42px;object-fit:contain;background:#e6ece8;flex:none}.asset span{font-size:12px;overflow-wrap:anywhere}.asset[aria-pressed=true]{color:var(--green);font-weight:bold}
.activity{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px}.activity-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.activity-title h2{margin:0}table{width:100%;border-collapse:collapse;font:12px Consolas,monospace}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #dce4df}th{color:var(--muted);font-weight:normal}#counter{font:12px Consolas,monospace}.footer{font-size:12px;color:var(--muted);margin-top:16px}
@media(max-width:800px){main{grid-template-columns:1fr;padding:14px;gap:20px}.assets{border-left:0;border-top:1px solid var(--line);padding:16px 0 0}.asset-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;max-height:240px}.activity{overflow:auto}header{padding:16px}.toolbar{gap:8px}.display{min-width:0}}
</style>
<header><div><h1>iC-7 Simulator</h1><span>v2.36 &middot; protocol simulation</span></div><div class="status"><i class="dot"></i><span id="connection">Starting</span></div></header>
<main>
<section>
<div class="toolbar"><label>View <select id="mode"><option value="layout">Layout preview</option><option value="received">Received image</option><option value="asset">Selected asset</option></select></label><label id="screen-label">Screen <select id="screen"></select></label><button id="download" type="button">Save Image</button></div>
<div class="display"><img id="display" alt="Simulated dash display"><video id="video-preview" muted loop controls playsinline hidden></video><span class="empty" id="empty" hidden>No image received</span></div>
<div class="caption"><span id="caption">Approximate layout &middot; no physical firmware execution</span><span>800 &times; 480</span></div>
</section>
<aside class="assets"><h2>Image Resources</h2><div class="asset-list" id="assets"></div></aside>
<section class="activity"><div class="activity-title"><h2>Device Traffic</h2><span id="counter">0 requests</span></div><table><thead><tr><th>Time</th><th>Operation</th><th>Address</th><th>Bytes</th></tr></thead><tbody id="events"></tbody></table><div class="footer" id="staged">No staged firmware data</div></section>
</main>
<script>
const mode=document.querySelector('#mode'),screen=document.querySelector('#screen'),display=document.querySelector('#display'),video=document.querySelector('#video-preview'),empty=document.querySelector('#empty');
let selected='',lastSignature='',lastImage='',viewRevision='';
for(let index=0;index<16;index++){const option=document.createElement('option');option.value=index;option.textContent=index+1;screen.append(option);}
function imageUrl(){if(mode.value==='asset')return '/asset?name='+encodeURIComponent(selected);if(mode.value==='received')return '/received.png';return '/layout.png?screen='+screen.value;}
function showImage(force=false){const base=imageUrl(),signature=base+'|'+viewRevision;if(signature===lastImage&&!force)return;if(!display.complete&&lastImage&&!force)return;lastImage=signature;const isVideo=mode.value==='asset'&&(/\.mp4$/i.test(selected)||/\/ic7_video_[^/]*\.png$/i.test(selected));const source=base+(base.includes('?')?'&':'?')+'t='+Date.now();document.querySelector('#screen-label').hidden=mode.value!=='layout';document.querySelector('#caption').textContent=mode.value==='layout'?'Approximate layout - no physical firmware execution':mode.value==='received'?'Uploaded screen image':selected;if(isVideo){display.hidden=true;video.hidden=false;if(video.src!==new URL(source,location.href).href){video.src=source;video.load();}video.play().catch(()=>{});}else{video.pause();video.removeAttribute('src');video.load();video.hidden=true;display.hidden=false;display.src=source;}}
display.onload=()=>{if(mode.value!=='asset'||!selected.toLowerCase().endsWith('.mp4'))display.hidden=false;empty.hidden=true;};display.onerror=()=>{display.hidden=true;empty.hidden=false;};video.onloadeddata=()=>{video.hidden=false;empty.hidden=true;};video.onerror=()=>{video.hidden=true;empty.hidden=false;};
mode.onchange=()=>showImage(true);screen.onchange=()=>showImage(true);
document.querySelector('#download').onclick=()=>{const link=document.createElement('a');link.href=imageUrl();link.download=mode.value==='asset'?selected.split('/').pop():'ic7-'+mode.value+'.png';link.click();};
async function update(){try{const response=await fetch('/api/status');const state=await response.json();document.querySelector('#connection').textContent=state.connection;document.querySelector('#counter').textContent=state.requests+' requests';const assets=state.assets.filter(item=>item.kind===0);const signature=JSON.stringify(assets);if(signature!==lastSignature){lastSignature=signature;lastImage='';const container=document.querySelector('#assets');container.replaceChildren();for(const item of assets){const button=document.createElement('button');button.className='asset';button.type='button';button.setAttribute('aria-pressed',String(item.name===selected));const image=document.createElement('img');image.src='/asset?name='+encodeURIComponent(item.name)+'&hash='+item.sha256;image.alt='';image.loading='lazy';const label=document.createElement('span');label.textContent=item.name;button.append(image,label);button.onclick=()=>{selected=item.name;mode.value='asset';for(const child of container.children)child.setAttribute('aria-pressed',String(child===button));showImage(true);};container.append(button);}}
const rows=document.querySelector('#events');rows.replaceChildren();for(const event of state.events){const row=document.createElement('tr');for(const value of [event.time,event.operation,event.address,event.bytes]){const cell=document.createElement('td');cell.textContent=value;row.append(cell);}rows.append(row);}document.querySelector('#staged').textContent=state.staged_regions.length?'Staged data: '+state.staged_regions.map(value=>'0x'+value.toString(16)).join(', ')+' - not executed':'No staged firmware data';viewRevision=mode.value==='received'?state.received_screen_revision:mode.value==='asset'?state.revision[1]:state.revision.join(':');showImage();}catch(error){document.querySelector('#connection').textContent='Viewer disconnected';}setTimeout(update,800);}
update();
</script>
</html>
