<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:GS;font-weight:400;src:url(font/GoogleSansFlex-400.ttf)}
@font-face{font-family:GS;font-weight:500;src:url(font/GoogleSansFlex-500.ttf)}
@font-face{font-family:GS;font-weight:700;src:url(font/GoogleSansFlex-700.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:860px;height:480px;background:#000;overflow:hidden;font-family:GS,sans-serif;color:#e3e3e3}
.v{color:#fff}.hide .v{color:transparent}
.rail{position:absolute;left:0;top:0;width:72px;height:480px;display:flex;flex-direction:column;align-items:center;padding-top:12px}
.time{height:24px;font-size:20px;font-weight:500;letter-spacing:.2px}
.status{display:flex;gap:5px;margin-top:4px;align-items:center}
.apps{margin-top:18px;display:flex;flex-direction:column;gap:14px;align-items:center}
.app{width:48px;height:48px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.app img{width:100%;height:100%}
.app.maps{background:#fff}.app.maps img{width:24px;height:34px}
.app.wb{background:#fff}.app.wb img{width:32px;height:32px}
.warn{height:24px;width:56px;margin-top:14px}
.grow{flex:1}
.circ{width:48px;height:48px;border-radius:50%;background:#2b2c2f;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.card{position:absolute;border-radius:24px;overflow:hidden;background:#1f1f22}
.main{left:80px;top:8px;width:472px;height:464px;background:#242f3e}
.map{position:absolute;inset:0}
.banner{position:absolute;left:10px;top:10px;width:452px;height:116px;background:#0e8345;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.banner .arrow{position:absolute;left:20px;top:22px;width:64px;height:64px}
.banner .lbl{position:absolute;left:110px;top:70px;font-size:20px;font-weight:500;opacity:.92;color:#fff}
.banner .track{position:absolute;left:24px;right:24px;top:98px;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}
.then{position:absolute;left:10px;top:122px;height:34px;padding:0 14px 0 12px;background:#0a6b37;border-radius:0 0 14px 14px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#fff}
.speed{position:absolute;left:18px;bottom:18px;width:100px;height:100px;border-radius:50%;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.speed .u{position:absolute;left:0;right:0;top:66px;text-align:center;font-size:13px;color:#5f6368;font-weight:500}
.limit{position:absolute;left:100px;bottom:96px;width:40px;height:40px;border-radius:50%;background:#fff;border:4px solid #d93025;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#202124}
.eta{position:absolute;right:12px;bottom:12px;height:60px;width:244px;background:#2d2e31;border-radius:30px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.eta .g{position:absolute;left:22px;top:20px;font-size:15px;color:#9aa0a6;font-weight:500}
.eta .x{position:absolute;right:8px;top:8px;width:44px;height:44px;border-radius:50%;background:#3c3d40;display:flex;align-items:center;justify-content:center}
.fab{position:absolute;right:16px;top:176px;width:44px;height:44px;border-radius:50%;background:#2d2e31;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.media{left:558px;top:8px;width:292px;height:216px}
.art{position:absolute;left:14px;top:14px;width:88px;height:88px;border-radius:14px;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.srcicon{position:absolute;right:14px;top:14px;width:22px;height:22px}
.mt{position:absolute;left:114px;top:18px;font-size:13px;color:#c4c7c5;font-weight:500}
.mu{position:absolute;left:114px;top:84px;font-size:14px;color:#9aa0a6}
.prog{position:absolute;left:16px;right:18px;top:124px;height:4px;border-radius:2px;background:#444746}
.ctrls{position:absolute;left:14px;right:14px;bottom:14px;height:62px;display:flex;justify-content:space-around;align-items:center}
.ctrls .play{width:96px;height:58px;border-radius:29px;background:#1ed760;display:flex;align-items:center;justify-content:center}
.vitals{left:558px;top:230px;width:292px;height:240px;padding:12px}
.vh{display:flex;align-items:center;gap:8px;font-size:14px;color:#c4c7c5;font-weight:500;margin:2px 4px 10px}
.vh img{width:20px;height:20px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{height:60px;border-radius:18px;background:#2b2c2f;position:relative}
.chip .ic{position:absolute;left:10px;top:15px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.chip .ic svg{width:18px;height:18px}
.chip .t{position:absolute;left:48px;top:8px;font-size:11px;color:#9aa0a6;font-weight:500}
.chip .uu{position:absolute;right:10px;bottom:9px;font-size:11px;color:#9aa0a6}
</style></head><body class="">
